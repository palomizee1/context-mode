name: CI

on:
  push:
    branches: [hardened]
  pull_request:
    branches: [hardened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 22.13 is the engines floor (node:sqlite without a flag); 24 is the current LTS.
        node: ["22.13", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # Older bundled corepack can't verify pnpm against npm's current signing keys.
      - run: npm install -g corepack@0.34.5
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm bundle
      - name: Bundle committed and up to date
        run: git diff --exit-code -- server.bundle.mjs
      - name: Guard (R1/R2/R5/R6)
        run: bash ci/guard.sh
      - name: Audit production deps
        run: pnpm audit --prod --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
